services:
  vllm:
    build:
      context: ./vllm
      args:
        VLLM_VERSION: ${VLLM_VERSION:-latest}
    image: vllm-server:${VLLM_VERSION:-latest}
    container_name: vllm
    ipc: host
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    env_file: .env
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      OMP_NUM_THREADS: ${VLLM_CPUS:-4}
    volumes:
      - ${HF_CACHE_DIR:-hf-cache}:/root/.cache/huggingface
    command: >
      --model ${MODEL}
      --served-model-name ${SERVED_NAME}
      --max-model-len ${MAX_MODEL_LEN}
      --gpu-memory-utilization ${GPU_MEM_UTIL}
      --tensor-parallel-size ${TP_SIZE}
      --api-key ${VLLM_API_KEY:?set VLLM_API_KEY in .env}
      --host 0.0.0.0 --port 8000
      ${EXTRA_ARGS:-}
    deploy:
      resources:
        limits:
          cpus: "${VLLM_CPUS:-4}"
          memory: ${VLLM_MEM_LIMIT:-10G}
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.9-3.6.1-ubuntu22.04
    container_name: dcgm-exporter
    cap_add: [SYS_ADMIN]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROM_RETENTION:-15d}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./volumes/prometheus:/prometheus
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9090:9090"
    depends_on:
      - vllm
    env_file: .env
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.50"
          memory: 512M

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./volumes/grafana:/var/lib/grafana
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.50"
          memory: 512M

volumes:
  hf-cache:
