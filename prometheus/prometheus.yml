global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8000"]

  - job_name: dcgm
    scrape_interval: 10s
    static_configs:
      - targets: ["dcgm-exporter:9400"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
